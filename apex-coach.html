<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>APEX — 50-Week Coach × Scarci</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="theme-color" content="#F7F9FB">
<style>
  :root{
    --bg:#F7F9FB;--surface:#FFFFFF;--surface2:#F0F3F6;--line:#DDE4EA;
    --text:#16212B;--muted:#5D6B78;--green:#059669;--cyan:#0284C7;
    --amber:#D97706;--red:#DC2626;--violet:#7C3AED;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Barlow Semi Condensed',-apple-system,system-ui,sans-serif;
    max-width:520px;margin:0 auto;padding-bottom:92px}
  .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(22,33,43,.05)}
  .label{font-size:10px;letter-spacing:0.7px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:block}
  input,select{background:var(--surface2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:12px;font-size:16px;width:100%;
    font-family:'IBM Plex Mono',ui-monospace,monospace;-webkit-appearance:none}
  .btn{background:var(--green);color:#FFFFFF;border:none;border-radius:10px;padding:13px 16px;
    font-size:15px;font-weight:700;width:100%;letter-spacing:.5px;cursor:pointer;font-family:inherit}
  .chip{padding:7px 12px;border-radius:999px;font-size:13px;white-space:nowrap;
    border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-family:inherit}
  .chip.on{border-color:var(--green);background:rgba(5,150,105,.10);color:var(--green)}
  .row{display:flex;gap:8px}
  .vital{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
  #nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;
    background:var(--surface2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  #nav button{flex:1;padding:12px 0 14px;background:none;border:none;color:var(--muted);
    font-size:10px;letter-spacing:0.7px;text-transform:uppercase;font-weight:500;
    border-top:2px solid transparent;cursor:pointer;font-family:inherit}
  #nav button.on{color:var(--green);font-weight:700;border-top-color:var(--green)}
  ul,ol{margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.55}
  svg text{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;fill:var(--muted)}
  h3{font-size:15px;font-weight:600;margin:0 0 8px}
  .del{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer}
  .scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
</style>
</head>
<body>
<div id="header" style="padding:16px 16px 8px"></div>
<div id="main" style="padding:8px 16px"></div>
<div id="timer" style="display:none;position:fixed;bottom:56px;left:0;right:0;max-width:520px;margin:0 auto;align-items:center;gap:8px;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -2px 8px rgba(22,33,43,.06);z-index:5"></div>
<div id="forgeHost" style="display:none"></div>
<div id="nav">
  <button data-tab="plan">Plan</button>
  <button data-tab="track">Log</button>
  <button data-tab="random">Extras</button>
  <button data-tab="index">Index</button>
  <button data-tab="forge">Forge</button>
  <button data-tab="more">More</button>
</div>
<script>
"use strict";
// ───────── data ─────────
const C={green:"#059669",cyan:"#0284C7",amber:"#D97706",red:"#DC2626",violet:"#7C3AED",pink:"#DB2777",muted:"#5D6B78",line:"#DDE4EA"};
const LIFTS=["Back Squat","Front Squat","Deadlift","Romanian Deadlift","Bench Press","Overhead Press","Push Press","Pendlay Row","Barbell Row","Hip Thrust","Walking Lunge","Thruster","Gauntlet Complex","Incline DB Press","Leg Press","Lat Pulldown","Seated Cable Row","Leg Curl","Leg Extension","DB Lateral Raise","Split Squat","Calf Raise","Barbell Curl","KB Swing","KB Goblet Squat","KB Clean","Z-Press","Renegade Row","Bulgarian Split Squat","Single-Leg RDL","Single-Arm Row","Step-Up"];
const BWK="Bodyweight";const WAIST="Waist";
const LC={"Back Squat":C.green,"Front Squat":C.green,"Deadlift":C.red,"Romanian Deadlift":C.red,"Bench Press":C.cyan,"Overhead Press":C.cyan,"Push Press":C.cyan,"Pendlay Row":C.amber,"Barbell Row":C.amber,"Hip Thrust":C.violet,"Walking Lunge":C.violet,"Thruster":C.violet,"Gauntlet Complex":C.red,"Incline DB Press":C.cyan,"Leg Press":C.green,"Lat Pulldown":C.amber,"Seated Cable Row":C.amber,"Leg Curl":C.red,"Leg Extension":C.green,"DB Lateral Raise":C.cyan,"Split Squat":C.violet,"Calf Raise":C.violet,"Barbell Curl":C.cyan,"KB Swing":C.amber,"KB Goblet Squat":C.amber,"KB Clean":C.amber,"Z-Press":C.cyan,"Renegade Row":C.amber,"Bulgarian Split Squat":C.amber,"Single-Leg RDL":C.amber,"Single-Arm Row":C.amber,"Step-Up":C.amber};
const GAUNT=s=>({d:"Sat",t:"THE GAUNTLET",c:C.red,items:s===1
 ?["Reduced version this block:","40 burpees for time","Ladder ×3: 5 DL → 5 row → 5 hang clean → 5 front squat → 5 push press → 5 back squat (~40 kg)","Bodyweight ×3: 15 push-ups, 20 air squats, 10 V-ups, 15 jump lunges","No bike cash-out"]
 :["60 burpees for time"+(s===4?" (burpee broad jumps)":""),"Ladder ×5: 5 DL → 5 row → 5 hang clean → 5 front squat → 5 push press → 5 back squat (start ~40 kg)","Bodyweight ×4 for time: 15 push-ups, 20 air squats, 10 V-ups, 15 jump lunges","Bike cash-out: 10 × 30 s all-out / 30 s easy"]});
const pick=(wi,a)=>a[Math.min(wi,a.length)-1];
const pickS=(wi,eff,arr)=>{const e=Math.max(1,eff);const idx=e<=1?arr.length-1:Math.round((Math.min(wi,e)-1)*(arr.length-1)/(e-1));return arr[Math.max(0,Math.min(arr.length-1,idx))];};
const GPRO=(bb)=>({d:"Sat",t:"THE GAUNTLET — PRO",c:C.red,items:[
 (bb?"70 burpee broad jumps for time":"70 burpees for time"),
 "Ladder ×5: 5 DL → 5 row → 5 hang clean → 5 front squat → 5 push press → 5 back squat (start ~45 kg)",
 "Add a ladder round every 2 weeks when all unbroken (cap 7)",
 "Bodyweight ×5 for time: 15 push-ups, 25 air squats, 12 V-ups, 20 jump lunges",
 "Run cash-out: 4 × 400 m hard, 60 s rest (bike 12×30/30 only if running is impossible)"]});
const HYSAT=(gw)=>{
 const v=((gw%7)+7)%7;
 const fuel="Biggest calorie session of the week — fuel it, then eat to the hard-day target";
 if(v===0)return {d:"Sat",t:"FURNACE — Hyrox Saturday",c:C.red,items:["1 km tempo run buy-in","5 rounds: 400 m run → 20 thrusters → 15 burpee broad jumps → 20 heavy bent-over rows","800 m run cash-out",fuel]};
 if(v===1)return {d:"Sat",t:"SLEDGE — Hyrox Saturday",c:C.red,items:["4 rounds: 600 m run → 30 m back-rack walking lunge → 12 hang power cleans → 15 V-ups","12-min alternating EMOM: odd = 40 s hard bike grind (sled sub) · even = 12 push presses","400 m all-out cash-out",fuel]};
 if(v===2)return {d:"Sat",t:"ANVIL — Hyrox Saturday (carries & grip)",c:C.red,items:["5 rounds: 400 m run → 50 m heavy KB/DB farmer carry → 15 heavy KB swings → 20 m walking lunge","3×40 s double-overhand bar hold, 1 min rest — grip is a Hyrox station in disguise","1 km run cash-out, holding form on dead arms",fuel]};
 if(v===3)return {d:"Sat",t:"PISTON — Hyrox Saturday (erg & wall-ball)",c:C.red,items:["1 km run buy-in","4 rounds: 60 s max-effort row/ski (or bike) → 15 thrusters (wall-ball sub) → 12 burpees → 200 m run","500 m run all-out cash-out",fuel]};
 if(v===4)return {d:"Sat",t:"PAYLOAD — Hyrox Saturday (sandbag proxy)",c:C.red,items:["4 rounds: 400 m run → 10 KB/DB ground-to-shoulder (alternate sides) → 40 m front-rack KB carry → 20 m front-rack walking lunge","3 rounds: 12 heavy step-ups (bar or DBs) → 10 devil presses","800 m run cash-out with whatever posture survives",fuel]};
 if(v===5)return {d:"Sat",t:"CYCLONE — Hyrox Saturday (descending ladder)",c:C.red,items:["For time: 800 m run → 10 thrusters + 10 burpee broad jumps → 600 m → 15 + 15 → 400 m → 20 + 20 → 200 m → 25 + 25","Pace the 800 like a race start — the ladder punishes early heroics","3×40 s hard bike grind to finish (sled sub)",fuel]};
 return {d:"Sat",t:"RICOCHET — Hyrox Saturday (short shuttles & barbell)",c:C.red,items:["Bar loaded at 50–60%, stays on the floor all session — the running keeps interrupting it","Part 1 — 8 rounds: 200 m hard run → 8 deadlifts → 6 hang power cleans","3 min rest — reload if needed","Part 2 — 6 rounds: 100 m shuttle (50 m out-and-back) → 8 front squats → 6 push presses","400 m all-out cash-out","The skill: hands on the bar within 5 s of stopping — no walking circles, no chalk theatre",fuel]};
};
const isGauntletWeek=w=>w%8===4&&DELOAD.indexOf(w)<0;
const SAT=(gw,bb)=>isGauntletWeek(gw)
 ?Object.assign(GPRO(bb),{t:"THE GAUNTLET — 8-WEEK BENCHMARK",items:GPRO(bb).items.concat(["Benchmark day: log buy-in time, ladder load and bodyweight-round time — compare with the last Gauntlet"])})
 :HYSAT(gw);
const BLOCK_DEFS=[
 {n:0,name:"Strength & Conditioning",nodl:true,from:1,to:4,color:C.violet,hint:"4-week opener: groove the big lifts at 75–80%, mixed-modal conditioning, and the baseline tests every % in the plan hangs off",
  focus:["Groove the big lifts @~75% · strength baselines Friday","Conditioning volume up · engine baseline Friday","Loads to ~80% · deadlift day","Consolidate — first Gauntlet benchmark Saturday"],
  days(wi){
   const sq=pickS(wi,this.len,["work to a solid 4×5 @~75% (feel, not grind)","4×5 @75%","4×5 @78%","4×5 @80%","5×5 @80%","5×4 @82%"]);
   const bp=pickS(wi,this.len,["work to 4×5 @~75%","4×5 @75%","4×5 @78%","4×5 @80%","5×5 @80%","5×4 @82%"]);
   const condR=pickS(wi,this.len-(this.nodl?0:1),[4,5,6,6]);
   const fri=wi===1?{d:"Fri",t:"BASELINES — strength",c:C.red,items:["Warm up fully → 3RM back squat","3RM bench press","3RM deadlift — stop at 1 rep in reserve, not a grinding max","Tap the header tiles and enter them: every % in this plan runs off these numbers"]}
    :wi===2?{d:"Fri",t:"BASELINES — engine",c:C.red,items:["20-min max bike test (FTP ≈ 95% of average power) OR 5 km run time trial — pick your primary","Log it; the Engine and VO2 blocks retest the same test"]}
    :{d:"Fri",t:"Full body — heavy",c:C.cyan,items:["Deadlift 4×4 @80%","Front squat 3×5 @75%","Push press 3×5","Weighted pull-up or lat pulldown 3×6"]};
   return [
    {d:"Mon",t:"Strength A — lower",c:C.cyan,items:["Back squat "+sq,"Romanian deadlift 3×6","Barbell split squat 3×8/side","Heavy slow calf raise 3×8 (tendon prep)","Ab rollout 3×10"]},
    {d:"Tue",t:"Conditioning — mixed modal",c:C.green,items:[condR+" rounds: 400 m run → 12 light thrusters → 10 burpees → 45 s hard bike","Steady, repeatable pace — round "+condR+" within 5% of round 1","6×20 s relaxed strides to finish"]},
    {d:"Wed",t:"Strength B — upper",c:C.cyan,items:["Bench press "+bp,"Pendlay row 4×6","Overhead press 3×6","Weighted pull-up or lat pulldown 3×8","Single-leg calf raise 3×8/side slow (tendon prep)"]},
    {d:"Thu",t:"Z2 run + strides",c:C.green,items:[(30+wi*5)+" min Z2 run — run frequency builds gently through this block","6×20 s strides"]},
    fri,
    SAT(this.from+wi-1,false),
    {d:"Sun",t:"Long ride",c:C.green,items:[(2+wi*0.25)+" h Z2"]}];
  },
  extras:[
   {t:"OPTIONAL — Hyrox Primer",c:C.red,items:["4 rounds: 600 m run → 20 thrusters → 12 burpee broad jumps → 60 m walking lunge","Aerobic control — HR back to Z2 between rounds","Slot: replace Thu"]},
   {t:"OPTIONAL — Killer Strength: Volume Day",c:C.amber,items:["Back squat 6×6 @70%","Bench 5×8 @70%","Row 5×8","Only in weeks 3–4, only if Friday\'s test day is not the next day"]}]},
{n:1,name:"Max Strength",from:3,to:8,color:C.green,hint:"80–95% waves · back-off volume · upper volume maintained on double days",
  focus:["Base week — groove 6×3 @80%, bar speed is law","6×3 @80–82% (+2.5 kg)","Wave 1 — 5×3 @85% + back-off 2×5 @75%","Wave 2 — 5×3 @85–87%, pause the first rep","PEAK — heavy single @92–95%, back-off 4×2 @85%","DELOAD — 70%, half volume"],
  days(wi){
   const dl=wi===this.len;
   const main=dl?"3×3 @70%":pickS(wi,this.len-1,["6×3 @80%","6×3 @80–82% (+2.5 kg)","5×3 @85% + back-off 2×5 @75%","5×3 @85–87%, pause first rep of each set + back-off 2×5 @75%","build to a heavy single @92–95%, then 4×2 @85%"]);
   const dead=dl?"3×3 @70%":pickS(wi,this.len-1,["5×3 @80%","5×3 @82%","5×3 @85%","5×3 @85%","build to a heavy single @92–95%"]);
   const hinge=wi%2?"Romanian deadlift 4×5":"Good morning 4×6 (crisp)";
   const uni=wi%2?"Barbell split squat 3×8/side":"Barbell step-up 3×8/side";
   const row=wi%2?"Pendlay row 5×4":"Bent-over row 5×6";
   const tue=pickS(wi,this.len-(this.nodl?0:1),["AM run: 5×3 min hard, 2 min jog","AM bike: 4×4 min VO2, 4 min easy","AM run: tempo 20 min continuous","AM bike: over-unders 3×10 min (2 over / 2 under)","AM run: 10×400 m at 5k effort, 200 m jog","AM: 45 min easy run or spin (deload)"]);
   return [
    {d:"Mon",t:"Lower — heavy",c:C.cyan,items:["Back squat "+main,hinge,uni,"Leg press 3×10 (back-off volume, after the barbell work)","Ab rollout 4×10","PM: easy spin 40 min Z1–2"]},
    {d:"Tue",t:"DOUBLE — intervals + upper volume",c:C.green,items:[tue,dl?"PM: off":"PM lift: bench 4×8 @70%, barbell row 4×8, OHP 3×8 — volume maintenance, RPE 7"]},
    {d:"Wed",t:"Upper — heavy",c:C.cyan,items:["Bench press "+main,row,"Overhead press 4×5","Lat pulldown 3×10 (back-off volume)",wi%2?"Barbell curl 3×10":"Close-grip bench 3×8","PM optional: easy run 30–40 min Z2"]},
    {d:"Thu",t:"Z2 run + spin",c:C.green,items:["45 min Z2 run, then 30–45 min easy spin — full ride only if legs need low impact",dl?"No hill sprints this week":"Finish the run with 6×8 s maximal hill sprints, walk-back recovery"]},
    {d:"Fri",t:"Full body — heavy",c:C.cyan,items:["Deadlift "+dead,"Front squat 4×4","Push press 4×3","Barbell row 4×5"]},
    dl?{d:"Sat",t:"Deload — easy day",c:C.green,items:["Rest or 40 min Z1 spin — no Gauntlet on deload weeks"]}:SAT(this.from+wi-1,false),
    {d:"Sun",t:"Long ride",c:C.green,items:[dl?"2 h Z2 max this week":"3–5 h Z2 — fuel it properly with fruit"]}];
  },
  extras:[
   {t:"OPTIONAL — Hyrox Primer PRO",c:C.red,items:["4 rounds: 600 m hard run → 20 thrusters → 12 burpee broad jumps → 60 m walking lunge","Aerobic control — HR back to Z2 before each round","Slot: replace Thu; never the day before Mon"]},
   {t:"OPTIONAL — Killer Strength: Cluster Day PRO",c:C.amber,items:["Back squat clusters 6×2 @92% — 20 s between reps, 3 min between sets","Push press 5×2 heavy","Pendlay row 4×3 heavy","Greens-only session: sleep 8 h+, appetite strong","48 h clear of the Gauntlet"]}]},
 {n:2,name:"Power 1 — Contrast",nodl:true,from:9,to:11,color:C.pink,hint:"Convert the new strength into speed — contrast sets, jumps, hill sprints. Low volume, maximal intent, ~2–8% running-economy money",
  focus:["Learn the contrasts — intent over load","Add a set everywhere — maximal intent","Sharpen — volume −30%, pure speed"],
  days(wi){
   return [
    {d:"Mon",t:"Contrast lower",c:C.cyan,items:["Back squat "+(wi===3?"3":"4")+"×3 @80% — each set immediately followed by 5 broad jumps, 3 min rest","Jump squat "+(wi===2?"5":"4")+"×5 @30% 1RM — maximal intent every rep","Single-leg pogo hops 3×12/side","Rule: the moment bar speed or jump height drops, the exercise is over"]},
    {d:"Tue",t:"Run intervals + strides",c:C.green,items:["6×2 min hard, 2 min jog","4×20 s relaxed strides after"]},
    {d:"Wed",t:"Contrast upper",c:C.cyan,items:["Bench press "+(wi===3?"3":"4")+"×3 @80% — each set followed by 5 plyo push-ups","Push press 4×3 — as fast as possible","Pendlay row 4×5, explosive off the floor"]},
    {d:"Thu",t:"Easy run + hill sprints",c:C.green,items:["35 min Z2 run","6×8–10 s maximal hill sprints, walk-back recovery — the highest-value 90 seconds in the programme"]},
    {d:"Fri",t:"Plyo circuit",c:C.cyan,items:["Pogo hops 3×20","Box or broad jumps "+(wi===2?"5":"4")+"×5 — stick every landing","Depth drops 3×5 (step off ~40 cm)","Bounding 4×30 m","Hollow hold 3×30 s"]},
    SAT(this.from+wi-1,false),
    {d:"Sun",t:"Long ride",c:C.green,items:["3 h Z2"]}];
  },
  extras:[
   {t:"OPTIONAL — Sprint Day",c:C.red,items:["Bike: 8×10 s max sprints from a slow roll, 3 min easy between","Or run: 6×60 m relaxed-fast accelerations","Full recovery between everything — quality only"]},
   {t:"OPTIONAL — Killer Strength: Speed-Strength Ladder",c:C.amber,items:["Back squat 8×2 @70% on a 60 s clock — every rep at max velocity","Push press 6×2 @70%, same rule","The moment bar speed visibly drops, the session is over"]}]},
 {n:3,name:"Hypertrophy",from:12,to:17,color:C.cyan,hint:"APEX hypertrophy: 20–22 hard sets/muscle/week — machines buy the extra volume at low systemic cost. Intensifiers on last sets. Calorie cycling matters most here",
  focus:["Volume base — 5×10 @67%","5×10 +load via double progression","Load up — 5×8 @75%","5×8 — top sets to RPE 9, drop set finishers","Heavy hypertrophy — 6×6 @80%","DELOAD — halve everything, eat at maintenance"],
  days(wi){
   const dl=wi===this.len;
   const sch=dl?"2×8 moderate":pickS(wi,this.len-1,["4×10 @65%","4×12 @65%","5×10 @67%","5×12 @68%","5×12 @70% — top of the block"]);
   const hip=wi%2?"Hip thrust 4×12":"Good morning 4×10";
   const lunA=wi%2?"Walking barbell lunge 3×12/leg":"Bulgarian split squat 3×10/leg";
   const lunB=wi%2?"Bulgarian split squat 3×10/leg":"Walking barbell lunge 3×12/leg";
   const tue=pickS(wi,this.len-(this.nodl?0:1),["AM run: 5×1 km comfortably hard","AM tempo run: 25 min","AM bike: sweet-spot 3×15 min","AM run: hill reps 10×60 s","AM run: 4×4 min hard, 3 min jog","AM: 45 min Z2 (deload)"]);
   return [
    {d:"Mon",t:"Lower 1",c:C.cyan,items:["Prime: jump squats 3×3 @30% — keep the power you just built","Back squat "+sch,"Romanian deadlift 4×10",lunA,"Leg press 3×12–15, 3 s negatives — last set drop 20% + AMRAP","Calf raise 4×15 — last set drop set"]},
    {d:"Tue",t:"DOUBLE — intervals + Upper 1",c:C.green,items:[tue,dl?"PM: off":"PM lift: bench press "+sch+", barbell row 5×10, OHP 4×10, lat pulldown 3×12–15 (drop set), barbell curl 3×12 (myo-reps)"]},
    {d:"Wed",t:"Upper 2 — pump",c:C.cyan,items:["Incline DB press 4×12 — 3 s negatives","Seated cable row 4×12 — 3 s negatives","DB lateral raise 3×15 — last set drop set","Push press 3×10","Skull crusher + curl 3×15 — myo-rep finish","PM: easy run 30 min Z2"]},
    {d:"Thu",t:"Z2 run",c:C.green,items:["60 min easy run — swap to a 90 min spin any week the legs are trashed; this block's total stress is the highest of the programme",dl?"No hill sprints this week":"Finish with 6×8 s hill sprints, walk-back recovery"]},
    {d:"Fri",t:"Lower 2",c:C.cyan,items:["Front squat "+sch,"Deadlift 4×6",hip,lunB,"Leg curl 3×10–12","Leg extension 3×12–15 — last set drop set"]},
    dl?{d:"Sat",t:"Deload — easy day",c:C.green,items:["Rest or 40 min Z1 spin"]}:SAT(this.from+wi-1,false),
    {d:"Sun",t:"Long ride",c:C.green,items:[dl?"2 h Z2 max":"3–5 h Z2"]}];
  },
  extras:[
   {t:"OPTIONAL — Hyrox Engine Builder PRO",c:C.red,items:["5 rounds: 1 km run → 25 thrusters → 15 burpee broad jumps","Hold even splits — round 5 within 5% of round 1","Slot: replace Thu"]},
   {t:"OPTIONAL — Killer Strength: Widowmaker PRO",c:C.amber,items:["Back squat 1×20 @65% — one set, no racking, breathe at the top","Then bench press AMRAP @70% ×2 sets","Row 4×12, RDL 3×12","Replaces Lower 2 that week — and you will not miss it"]}]},
 {n:4,name:"Muscular Endurance",from:18,to:23,color:C.amber,hint:"20–30 reps · giant sets · 30–40 s rests · highest weekly calorie burn",
  focus:["20s — settle into the discomfort","25s — extend it","25s + giant sets","30s — full range","DENSITY — same work, 30 s rests","DELOAD + RETEST — 3RM + heavy single vs baseline"],
  days(wi){
   const dl=wi===this.len;
   const reps=pickS(wi,this.len-(this.nodl?0:1),[20,25,25,30,25]);
   const rounds=pickS(wi,this.len-(this.nodl?0:1),[5,6,6,7,7]);
   const rot=pickS(wi,this.len-(this.nodl?0:1),[6,6,7,7,8]);
   const rest=wi===5?"30 s rests everywhere this week":"Rests 30–40 s";
   const tue=pickS(wi,this.len-(this.nodl?0:1),["AM run: 6×1 km comfortably hard","AM run: tempo 25 min","AM bike: sweet-spot 3×15 min","AM run: 8×600 m at 5k effort","AM run: 30 min progression (finish hard)","AM: 45 min Z2 (deload)"]);
   if(dl)return [
    {d:"Mon",t:"Deload — light movement",c:C.cyan,items:["Back squat 2×10 light","RDL 2×10 light","Mobility 15 min"]},
    {d:"Tue",t:"Z2 spin",c:C.green,items:["45 min easy"]},
    {d:"Wed",t:"RETEST DAY",c:C.red,items:["Warm up fully → 3RM back squat, then build to a heavy single","Rest 10 min → 3RM bench or OHP + heavy single","Log everything — compare to the Week 1 baselines"]},
    {d:"Thu",t:"Rest",c:C.green,items:["Full rest or 30 min walk"]},
    {d:"Fri",t:"Optional easy circuit",c:C.cyan,items:["2 gentle EMOM rotations at 50% — or rest"]},
    {d:"Sat",t:"Easy ride",c:C.green,items:["2 h Z2 max"]},
    {d:"Sun",t:"Easy run",c:C.green,items:["45 min Z2"]}];
   return [

function lineChart(data,key,color,h){
  if(!data.length)return "";
  const W=460,H=h||200,P={l:38,r:10,t:12,b:22};
  const vals=data.map(d=>d[key]);
  let lo=Math.min(...vals),hi=Math.max(...vals);
  if(lo===hi){lo-=1;hi+=1} const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
  const x=i=>data.length===1?W/2:P.l+i*(W-P.l-P.r)/(data.length-1);
  const y=v=>P.t+(1-(v-lo)/(hi-lo))*(H-P.t-P.b);
  let pts=data.map((d,i)=>x(i)+","+y(d[key])).join(" ");
  let g="";for(let i=0;i<4;i++){const gy=P.t+i*(H-P.t-P.b)/3;const gv=hi-(hi-lo)*i/3;
    g+='<line x1="'+P.l+'" y1="'+gy+'" x2="'+(W-P.r)+'" y2="'+gy+'" stroke="'+C.line+'" stroke-dasharray="2 6"/><text x="'+(P.l-4)+'" y="'+(gy+3)+'" text-anchor="end">'+Math.round(gv*10)/10+'</text>'}
  let dots=data.map((d,i)=>'<circle cx="'+x(i)+'" cy="'+y(d[key])+'" r="3.5" fill="'+color+'"/>').join("");
  let lbl=data.map((d,i)=>(data.length<=8||i%Math.ceil(data.length/8)===0)?'<text x="'+x(i)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(d.week)+'</text>':"").join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+g+'<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.5"/>'+dots+lbl+'</svg>'}
function barChart(data,key,color,h){
  if(!data.length)return "";
  const W=460,H=h||180,P={l:44,r:10,t:12,b:22};
  const hi=Math.max(...data.map(d=>d[key]))*1.12||1;
  const bw=Math.min(26,(W-P.l-P.r)/data.length*0.6);
  let g="";for(let i=0;i<4;i++){const gy=P.t+i*(H-P.t-P.b)/3;const gv=hi-hi*i/3;
    g+='<line x1="'+P.l+'" y1="'+gy+'" x2="'+(W-P.r)+'" y2="'+gy+'" stroke="'+C.line+'" stroke-dasharray="2 6"/><text x="'+(P.l-4)+'" y="'+(gy+3)+'" text-anchor="end">'+Math.round(gv)+'</text>'}
  let bars=data.map((d,i)=>{const cx=P.l+(i+.5)*(W-P.l-P.r)/data.length;
    const bh=(d[key]/hi)*(H-P.t-P.b);
    return '<rect x="'+(cx-bw/2)+'" y="'+(H-P.b-bh)+'" width="'+bw+'" height="'+bh+'" rx="4" fill="'+color+'"/><text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle">'+esc(d.week)+'</text>'}).join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+g+bars+'</svg>'}

function hrInfo(){
  const t=todayISO();const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  const list=state.hr.slice().sort((a,b)=>a.date<b.date?1:-1);
  const td=list.find(e=>e.date===t), yd=list.find(e=>e.date===y);
  const older=list.filter(e=>e.date<y).slice(0,14);
  if(older.length<3)return {level:null,msg:"Log your waking HR daily — after 3 mornings the readiness flag activates.",color:"var(--muted)"};
  const base=Math.round(older.reduce((s,e)=>s+e.hr,0)/older.length);
  if(!td)return {level:null,msg:"Baseline ~"+base+" bpm. Log this morning's HR for today's readiness.",color:"var(--muted)"};
  const d=td.hr-base;
  if(d>=5&&yd&&yd.hr-base>=5)return {level:"red",msg:"BACK OFF — +"+d+" bpm over baseline two days running. Drop today one gear: no extras, no Gauntlet escalation.",color:"var(--red)"};
  if(d>=5)return {level:"amber",msg:"+"+d+" bpm over baseline ("+base+"). Proceed, but extras are off — stop every set earlier.",color:"var(--amber)"};
  return {level:"green",msg:"READY — "+td.hr+" bpm vs baseline "+base+". Train as planned.",color:"var(--green)"};
}

  const t=todayISO();state.hr=state.hr.filter(e=>e.date!==t);
  state.hr.unshift({id:Date.now(),date:t,hr:v});save();render();

const allLifts=()=>LIFTS.concat(state.customLifts);
function addCustom(){
  const el=document.getElementById("cx");
  let n=(el.value||"").trim().slice(0,24);
  if(!n)return;
  const all=allLifts().concat([BWK,WAIST]).map(x=>x.toLowerCase());
  if(all.indexOf(n.toLowerCase())>=0)return alert("Already in the list");
  state.customLifts.push(n);ui.fx=n;save();render();
}
function delCustom(i){
  const n=state.customLifts[i];
  state.customLifts.splice(i,1);
  if(ui.fx===n)ui.fx="Back Squat";
  if(ui.chartEx===n)ui.chartEx="Back Squat";
  save();render();
}
function setChartEx(i){ui.chartEx=allLifts()[i];render()}
function addCardio(){
  const mn=parseInt(document.getElementById("cmin").value);
  if(!mn||mn<=0)return alert("Enter duration in minutes");
  const km=parseFloat(document.getElementById("ckm").value)||null;
  const hr=parseInt(document.getElementById("chr").value)||null;
  state.cardio.unshift({id:Date.now(),date:document.getElementById("cd").value||todayISO(),type:ui.cardType,min:mn,km:km,hr:hr});
  save();render();
}
function delCardio(id){state.cardio=state.cardio.filter(e=>e.id!==id);save();render()}

function addEntry(){
  const w=parseFloat(document.getElementById("fw").value);
  if(isNaN(w)||w<=0)return alert("Enter a weight");
  const isBW=ui.fx===BWK||ui.fx===WAIST;
  const fr=document.getElementById("fr"),fs=document.getElementById("fs");
  state.entries.unshift({id:Date.now(),date:document.getElementById("fd").value||todayISO(),exercise:ui.fx,weightKg:w,
    reps:isBW?null:Math.max(1,parseInt(fr&&fr.value)||1),sets:isBW?null:Math.max(1,parseInt(fs&&fs.value)||1)});
  save();render();
}
function delEntry(id){state.entries=state.entries.filter(e=>e.id!==id);save();render()}

function collectBlockSessions(def){
  const inst=Object.create(def);const len=def.to-def.from+1;
  inst.from=1;inst.len=len;inst.to=len;
  const seen={},out=[];
  for(let wi=1;wi<=len;wi++){
    try{inst.days(wi).forEach(d=>{if(!seen[d.t]){seen[d.t]=1;out.push({t:d.t,c:d.c,items:d.items,wk:wi});}});}catch(e){}

  return out;
}

  if(state.lastMG){const g=state.lastMG;
    h+='<div class="card" style="border-left:3px solid '+g.color+'"><div style="font-size:17px;font-weight:700">'+esc(g.name)+'</div>'+
     '<ul style="margin-top:8px">'+g.items.map(x=>{const i=x.indexOf(":");return '<li><b style="color:'+g.color+'">'+esc(x.slice(0,i))+'</b>'+esc(x.slice(i))+'</li>'}).join("")+'</ul>'+
     '<div style="font-size:12px;color:var(--muted);margin-top:10px">'+esc(g.note)+'</div></div>';
    h+='<div class="card" style="font-size:13px;color:var(--muted)">Log the primary and secondary in the Log tab so they count toward your e1RM tiles and tonnage.</div>';}
  return h;
}
function renderRandom(){
  let h='<div class="card" style="font-size:12px;color:var(--muted)">Everything here is an ADD-ON. The plan runs exactly as written — nothing below replaces, moves, or substitutes a programmed session. Add on green days and spare capacity.</div>';
  h+='<div class="row" style="margin-bottom:12px;flex-wrap:wrap"><button class="chip'+(["mg","comp","inv"].indexOf(ui.randSub)<0?" on":"")+'" onclick="ui.randSub=\'hard\';render()">Generator</button><button class="chip'+(ui.randSub==="mg"?" on":"")+'" onclick="ui.randSub=\'mg\';render()">Muscle group</button><button class="chip'+(ui.randSub==="comp"?" on":"")+'" onclick="ui.randSub=\'comp\';render()">Fatigued runs</button><button class="chip'+(ui.randSub==="inv"?" on":"")+'" onclick="ui.randSub=\'inv\';render()">Invictus</button><button class="chip'+(ui.randSub==="nine"?" on":"")+'" onclick="ui.randSub=\'nine\';render()">21-15-9</button></div>';
  if(ui.randSub==="mg")return h+renderMG();
  if(ui.randSub==="comp")return h+renderComp();
  if(ui.randSub==="inv")return h+renderInvictus();
  if(ui.randSub==="nine")return h+renderNine();
  h+='<div class="card" style="font-size:13px;color:var(--muted);line-height:1.5">One button, one hard run/barbell workout — different every time. Built from the same movement pools as the programme, so nothing here needs kit you don\'t have.</div>';
  h+='<button class="btn" style="margin-bottom:12px" onclick="rollWorkout()">'+(state.lastGen?"Re-roll — give me another":"Generate a workout")+'</button>';
  if(state.lastGen){const g=state.lastGen;
    h+='<div class="card" style="border-left:3px solid var(--red)">'+
     '<div style="font-size:19px;font-weight:700">'+g.name+'</div>'+
     '<div class="mono" style="font-size:12px;color:var(--red);margin-top:2px">'+g.fmt+'</div>'+
     '<ul style="margin-top:8px">'+g.items.map(x=>'<li>'+x+'</li>').join("")+'</ul>'+
     '<div style="font-size:12px;color:var(--muted);margin-top:10px">'+g.note+'</div></div>';
    h+='<div class="card" style="font-size:13px;color:var(--muted)">Done it? Log the barbell weight under the matching lift in the Log tab so it counts toward tonnage.</div>';
  }
  return h;
}
function render(){
  renderHeader();
  const m=document.getElementById("main");
  const fh=document.getElementById("forgeHost");
  if(ui.tab==="forge"){m.innerHTML="";if(fh){initForge();fh.style.display="block";}}
  else{if(fh)fh.style.display="none";
    m.innerHTML=ui.tab==="plan"?(ui.session?renderSession():renderPlan()):ui.tab==="track"?renderTrack():ui.tab==="random"?renderRandom():ui.tab==="index"?renderIndex():renderMore();}
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===ui.tab));
}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;ui.session=null;render()});
render();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("./sw.js").catch(()=>{});}
</script>

<div class="wrap" id="app"></div>

<script>
"use strict";
// =============== RACE DATA ===============
// The 8 Hyrox stations in official race order, with open-division specs and no-kit substitutions
const STATIONS = [
  { id:"ski",  name:"SkiErg",            race:"1000m",                    sub:"Row 1000m, or 90 burpees" },
  { id:"push", name:"Sled Push",         race:"50m (heavy)",              sub:"Motor-off treadmill push 60s, or 20 heavy leg press reps" },
  { id:"pull", name:"Sled Pull",         race:"50m",                      sub:"Heavy towel/rope rows × 25, or bent-over rows 3 × 12" },
  { id:"bbj",  name:"Burpee Broad Jumps",race:"80m",                      sub:"None needed — just floor space" },
  { id:"row",  name:"Row",               race:"1000m",                    sub:"SkiErg 1000m, or 60 KB swings + 40 jump squats" },
  { id:"farm", name:"Farmers Carry",     race:"200m (2 × heavy KB)",      sub:"Heaviest DBs available, more laps" },
  { id:"lung", name:"Sandbag Lunges",    race:"100m (sandbag on back)",   sub:"DB front-rack walking lunges" },
  { id:"wall", name:"Wall Balls",        race:"100 reps (75 in women's)", sub:"DB thrusters, same rep count" },
];
const BY_ID = Object.fromEntries(STATIONS.map(s=>[s.id,s]));

const RUN_KM = 5.0;      // training minutes per 1km at compromised pace
const STATION_MIN = 4.0; // avg minutes to clear one station effort

const pick  = a => a[Math.floor(Math.random()*a.length)];
const pickN = (a,n) => { const c=[...a],o=[]; while(o.length<n&&c.length) o.push(c.splice(Math.floor(Math.random()*c.length),1)[0]); return o; };
const inRaceOrder = ids => STATIONS.filter(s=>ids.includes(s.id)).map(s=>s.id);
const todayStr = () => new Date().toISOString().slice(0,10);
const fmtDate = d => new Date(d+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Typical open-division times (seconds) — used by the race predictor where you have no logged best
const TYPICAL = { ski:255, push:150, pull:210, bbj:270, row:255, farm:105, lung:210, wall:300, runkm:300 };
const ROXZONE_SEC = 360; // transition zone allowance across the whole race

// Time helpers: accept "4:32" or "272" (seconds); display as m:ss
function parseTime(str){
  if (!str) return null;
  const t = String(str).trim();
  if (/^\d+:\d{1,2}$/.test(t)){ const [m,sec]=t.split(":").map(Number); return sec<60 ? m*60+sec : null; }
  if (/^\d+(\.\d+)?$/.test(t)){ const v=parseFloat(t); return v>0 ? Math.round(v) : null; }
  return null;
}
const fmtTime = sec => Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0");

// Dependency-free single-series chart (lower = faster = better)
function timeChart(data, upGood, fmtFn){
  const F = fmtFn || fmtTime;
  const W=560, H=240, padL=52, padR=16, padT=16, padB=32;
  const vals = data.map(d=>d.sec);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min===max){ min-=15; max+=15; }
  const span = max-min; min -= span*0.12; max += span*0.12;
  const x = i => padL + (data.length===1 ? (W-padL-padR)/2 : i*(W-padL-padR)/(data.length-1));
  const y = v => padT + (H-padT-padB) * (1 - (v-min)/(max-min));
  let grid="", labels="";
  for (let t=0;t<=4;t++){
    const v = min + (max-min)*t/4, yy = y(v);
    grid += `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#E6E7E3" stroke-dasharray="3 3"/>`;
    labels += `<text x="${padL-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="#565B63">${F(Math.round(v))}</text>`;
  }
  let xlabels="";
  const step = Math.max(1, Math.ceil(data.length/7));
  data.forEach((d,i)=>{ if (i%step===0 || i===data.length-1)
    xlabels += `<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="#565B63">${esc(d.date)}</text>`; });
  const path = data.map((d,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(d.sec).toFixed(1)}`).join(" ");
  const dots = data.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.sec)}" r="5" fill="#C7A200" stroke="#fff" stroke-width="2"><title>${esc(d.date)}: ${F(d.sec)}</title></circle>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Time trend" style="width:100%;height:auto">
    ${grid}${labels}${xlabels}
    <path d="${path}" fill="none" stroke="#C7A200" stroke-width="3"/>${dots}
  </svg>
  <p style="font-size:11px;color:var(--sub);margin-top:4px">${upGood?"Up and to the right = more time at VO\u2082max \u2014 that's the win.":"Down and to the right = getting faster."}</p>`;
}

// =============== SESSION TEMPLATES ===============
// Each returns { type, title, blocks:[{title,lines,minutes,intent}], stations:[ids], sig }
// sig = the uniqueness signature; two sessions with the same sig are "the same workout".

const PACES = [
  "at goal race pace throughout",
  "runs 10s/km slower than race pace, negative-split the back half",
  "alternate kms: odd hard, even steady",
];

const TEMPLATES = [
  { id:"fullsim", label:"Full Race Simulation", minBudget:76,
    make(budget){
      const pace = pick(PACES);
      const lines = ["Stations in race order, 1km run before each:"];
      STATIONS.forEach((s,i)=> lines.push(`${i+1}. Run 1km → ${s.name} ${s.race}`));
      return { blocks:[{ title:"Full Hyrox Simulation", lines,
        minutes: Math.round(8*RUN_KM + 8*STATION_MIN + 4),
        intent:`The whole race. Go ${pace}. Note your station splits — they tell you where the next month of training should aim.` }],
        stations: STATIONS.map(s=>s.id), sig:["fullsim", pace] };
    }},
  { id:"halfsim", label:"Half Simulation", minBudget:40,
    make(budget){
      const ids = inRaceOrder(pickN(STATIONS.map(s=>s.id),4));
      const laps = budget >= 78 ? 2 : 1;
      const lines = [`${laps===2?"2 circuits of the":"One circuit,"} 4 stations, race order, 1km run before each:`];
      ids.forEach((id,i)=> lines.push(`${i+1}. Run 1km → ${BY_ID[id].name} ${BY_ID[id].race}`));
      return { blocks:[{ title:`Half Sim${laps===2?" × 2 Circuits":""}`, lines,
        minutes: Math.round(laps*(4*RUN_KM+4*STATION_MIN)+3),
        intent:"Half the race at full race intensity. Faster than race pace is the point — you should finish knowing you pushed harder than you could for 8 stations." }],
        stations: ids, sig:["halfsim", laps, ...ids] };
    }},
  { id:"compromised", label:"Compromised Running", minBudget:34,
    make(budget){
      const ids = pickN(STATIONS.map(s=>s.id),3);
      const perRound = 3*(STATION_MIN + 4.2) + 2;  // 3 × (station + 800m) + rest
      const roundsFinal = Math.max(2, Math.min(5, Math.floor(budget/perRound)));
      const lines = [`${roundsFinal} rounds, rest 2 min between rounds:`];
      ids.forEach(id=> lines.push(`${BY_ID[id].name} ${BY_ID[id].race} → run 800m at race pace`));
      return { blocks:[{ title:"Compromised Running Intervals", lines,
        minutes: Math.round(roundsFinal*perRound - 2),
        intent:"Running on wrecked legs is THE Hyrox skill. Hit the station hard, then find race rhythm within the first 200m of every run — not the last." }],
        stations: ids, sig:["compromised", roundsFinal, ...ids.slice().sort()] };
    }},
  { id:"strength", label:"Station Strength", minBudget:32,
    make(budget){
      const ids = pickN(["push","pull","farm","lung","wall"],3);
      const overload = pick(["+25% above race weight","race weight, 20% more distance/reps","race weight, minimal rest"]);
      const lines = [`4 heavy sets of each station (${overload}):`];
      ids.forEach(id=> lines.push(`${BY_ID[id].name} — ${BY_ID[id].race}`));
      lines.push("Easy 400m jog between stations");
      return { blocks:[{ title:"Station Strength Overload", lines,
        minutes: Math.round(3*10+2*2.2+3),
        intent:"Make race weight feel light. Overload here is what turns the sleds from a wall into a speed bump on race day." }],
        stations: ids, sig:["strength", overload, ...ids.slice().sort()] };
    }},
  { id:"engine", label:"Engine Intervals", minBudget:28,
    make(budget){
      const schemes = [
        { l:["5 rounds: 500m row + 500m SkiErg + 400m run, no rest between, 90s between rounds"], m:42, ids:["row","ski"] },
        { l:["10 × 400m run at 5k pace, 200m jog recovery"], m:32, ids:[] },
        { l:["4 rounds: 1000m row hard + 600m run steady, 2 min rest"], m:36, ids:["row"] },
        { l:["8 × 250m SkiErg sprint, 1:1 rest, then 1km run time-trial"], m:30, ids:["ski"] },
        { l:["3 rounds: 1km run + 750m row + 500m SkiErg, descending effort each round"], m:44, ids:["row","ski"] },
        { l:["6 × 800m run at race pace, 90s standing rest"], m:38, ids:[] },
      ].filter(s=>s.m<=budget+6);
      const s = pick(schemes.length?schemes:[{ l:["6 × 400m run hard, 200m jog"], m:24, ids:[] }]);
      return { blocks:[{ title:"Engine Intervals", lines:s.l, minutes:s.m,
        intent:"Aerobic horsepower. Even splits across every interval — the last one should match the first, not limp home." }],
        stations:s.ids, sig:["engine", s.l[0]] };
    }},
  { id:"vo2", label:"VO\u2082 Max Intervals", minBudget:26,
    make(budget){
      const protocols = [
        { l:["4 \u00d7 4 min run @ 90-95% max HR, 3 min easy jog between (Norwegian 4\u00d74)"], m:34, ids:[] },
        { l:["5 \u00d7 3 min run hard, 2 min jog recovery"], m:31, ids:[] },
        { l:["Billat 30/30s: 2 sets of 12 \u00d7 (30s @ vVO\u2082 pace / 30s float), 3 min between sets"], m:33, ids:[] },
        { l:["6 \u00d7 800m @ 3k-5k effort, 2:30 standing rest"], m:36, ids:[] },
        { l:["Hill VO\u2082: 8 \u00d7 90s uphill hard, easy jog down"], m:32, ids:[] },
        { l:["SkiErg 40/20s: 15 \u00d7 (40s hard / 20s easy), then 5 min easy spin"], m:26, ids:["ski"] },
        { l:["Row 4 \u00d7 750m @ max sustainable pace, 1:1 rest"], m:30, ids:["row"] },
        { l:["Mixed machine 4\u00d74: 4 rounds of (2 min row + 2 min run) @ 90-95% max HR, 3 min easy between"], m:36, ids:["row"] },
        { l:["Bike 5 \u00d7 4 min @ 105-110% FTP, 4 min easy spin between"], m:42, ids:[] },
        { l:["3 \u00d7 (1200m run @ 5k pace + 400m float), no full stops"], m:30, ids:[] },
      ].filter(x=>x.m<=budget+6);
      const pr = pick(protocols.length?protocols:[{ l:["4 \u00d7 3 min run hard, 2 min jog"], m:24, ids:[] }]);
      return { blocks:[{ title:"VO\u2082 Max Intervals", lines:pr.l, minutes:pr.m,
        intent:"The ceiling-raiser. Work reps should reach 90%+ of max HR by their final minute \u2014 hard but repeatable, with the last rep matching the first. If you fade before the end, you started too hot." }],
        stations:pr.ids, sig:["vo2", pr.l[0]] };
    }},
  { id:"capacity", label:"Wall Ball + Burpee Capacity", minBudget:28,
    make(budget){
      const scheme = pick([[40,30,20,10],[50,35,20],[30,25,20,15,10],[45,30,15]]);
      const lines = [`Wall ball sets: ${scheme.join("-")}`,
        "After each set: 20m burpee broad jumps + 400m run"];
      return { blocks:[{ title:"Capacity Builder", lines,
        minutes: Math.round(scheme.length*(scheme[0]/14 + 2 + 2.2)+4),
        intent:"Wall balls end the race for a reason. Learn your break strategy here — planned sets of 15-20 beat heroic sets of 40 followed by staring at the ball." }],
        stations:["wall","bbj"], sig:["capacity", scheme.join("-")] };
    }},
  { id:"bricks", label:"Race-Pace Bricks", minBudget:38,
    make(budget){
      const ids = pickN(STATIONS.map(s=>s.id),2);
      const n = Math.max(5, Math.min(9, Math.floor(budget/7.5)));
      const lines = [`${n} bricks, alternating stations:`,
        `Run 1km at race pace → ${BY_ID[ids[0]].name} ${BY_ID[ids[0]].race}`,
        `Run 1km at race pace → ${BY_ID[ids[1]].name} ${BY_ID[ids[1]].race}`];
      return { blocks:[{ title:`${n} × Race-Pace Bricks`, lines,
        minutes: Math.round(n*(RUN_KM+2.5)),
        intent:"Groove the exact rhythm of race day: run, work, run, work. Transitions under 10 seconds — walking to the station is free time you're giving away." }],
        stations: ids, sig:["bricks", n, ...ids] };
    }},
  { id:"weakness", label:"Weakness Doubles", minBudget:36,
    make(budget){
      const ids = pickN(STATIONS.map(s=>s.id),2);
      const rounds = budget>=64 ? 5 : 4;

const VO2_CUES = [

const WARMUP_VO2 = { lines:["10 min easy in your chosen modality, building the last 3 min","3 \u00d7 20s surges at work pace, 40s easy between","2 min easy before rep 1"], min:14 };
const COOLDOWN_VO2 = { lines:["5 min very easy in your modality \u2014 let HR drift down"], min:5 };

function makeVO2Session(targetMin, mode){
  const budget = targetMin - WARMUP_VO2.min - COOLDOWN_VO2.min;
  const eligible = VO2_PROTOCOLS.filter(pr=>pr.minB<=budget);
  const pr = pick(eligible.length?eligible:[VO2_PROTOCOLS[3]]);
  const built = pr.make(mode, budget);
  const total = WARMUP_VO2.min + built.minutes + COOLDOWN_VO2.min;
  return { type:"VO\u2082 Max", protocol:pr.name, mode,
    blocks:[{ title:`${pr.name} \u2014 ${VO2_MODES[mode]}`, lines:built.lines, minutes:built.minutes,
      intent:"The point is minutes near VO\u2082max, not heroics: reach 90%+ max HR by the end of each work bout and repeat it. Last rep matches the first \u2014 if you fade, the opener was too hot." }],
    total, sig: JSON.stringify(["vo2tab", pr.id, mode, ...built.sigx]) };
}
function generateUniqueVO2(targetMin, mode, completedSigs){
  for (let i=0;i<60;i++){
    const s = makeVO2Session(targetMin, mode);
    if (!completedSigs.has(s.sig)) return s;
  }
  return makeVO2Session(targetMin, mode);
}
// Progression cue: how many VO2-tab sessions banked in the last 28 days
function vo2Progression(){
  const cutoff = Date.now() - 28*864e5;
  const n = state.done.filter(d=>d.type==="VO\u2082 Max" && new Date(d.date+"T00:00:00").getTime()>=cutoff).length;
  if (n<=1) return `Session ${n+1} in this 28-day block \u2014 establish a repeatable work pace before chasing more.`;
  if (n<=3) return `Session ${n+1} in 28 days \u2014 progress by one rep or ~5s more per work bout than last time.`;
  return `Session ${n+1} in 28 days \u2014 volume is there; hold reps and nudge the work-bout pace instead.`;
}

const FOCUS_SCHEMES = [
  { n:"Strength emphasis", comp:"4 \u00d7 6, rest 2-3 min", iso:"3 \u00d7 10-12, rest 75s", cue:"Heavy compounds first \u2014 add load before you add reps." },
  { n:"Volume emphasis",   comp:"4 \u00d7 10, rest 90s",   iso:"3 \u00d7 15, rest 60s",   cue:"Chase the pump: 2s negatives, no lockout rest, every set close to failure." },
  { n:"Density emphasis",  comp:"5 \u00d7 8, rest 60s",    iso:"3 \u00d7 12, rest 45s",   cue:"Same load, less rest \u2014 muscular endurance in a strength wrapper. Watch the clock, not the mirror." },
];

function makeFocusSession(targetMin, groups, equip){
  const budget = targetMin - WARMUP_STR.min - COOLDOWN.min;
  const scheme = pick(FOCUS_SCHEMES);
  const groupList = groups.length ? groups : ["quads"];
  const perGroup = groupList.length===1 ? {c:2,i:3} : groupList.length===2 ? {c:2,i:2} : {c:1,i:1};
  const blocks = [];
  const sigParts = ["focus", scheme.n, equip, ...groupList];
  const usedNames = new Set();
  const uniqPickN = (list, n) => { const out=[]; pickN(list.filter(e=>!usedNames.has(e.n)), n).forEach(e=>{usedNames.add(e.n); out.push(e.n);}); return out; };
  let est = 0;
  groupList.forEach(g=>{
    const M = MUSCLES[g];
    const comps = filt(M.ex.filter(e=>e.comp), equip);
    const isos  = filt(M.ex.filter(e=>!e.comp), equip);
    const chosenC = uniqPickN(comps, Math.min(perGroup.c, comps.length));
    const chosenI = uniqPickN(isos, Math.min(perGroup.i, isos.length));
    const lines = chosenC.map(n=>`${n}: ${scheme.comp}`).concat(chosenI.map(n=>`${n}: ${scheme.iso}`));
    const mins = Math.round(chosenC.length*(scheme.n==="Strength emphasis"?11:8) + chosenI.length*5);
    est += mins;
    blocks.push({ title:`${M.label} \u2014 ${scheme.n}`, lines, minutes:mins, intent:`${M.why}. ${scheme.cue}` });
    sigParts.push(...chosenC, ...chosenI);
  });
  // Over budget? Drop isolation lines from the end (compounds are protected)
  while (est > budget + 6 && blocks.some(b=>b.lines.length>1)){
    const b = blocks.slice().reverse().find(x=>x.lines.length>1);
    b.lines.pop(); b.minutes -= 5; est -= 5;
  }
  const total = WARMUP_STR.min + est + COOLDOWN.min;
  return { type:"Muscle Focus", groups:groupList, blocks, total, sig:JSON.stringify(sigParts) };
}
function generateUniqueFocus(targetMin, groups, equip, completedSigs){
  for (let i=0;i<60;i++){
    const s = makeFocusSession(targetMin, groups, equip);
    if (!completedSigs.has(s.sig)) return s;
  }
  return makeFocusSession(targetMin, groups, equip);
}

const WARMUP = { lines:["800m easy run","2 rounds: 10 leg swings/side, 10 air squats, 10 arm circles, 5 inchworms","2 min easy on your first station's movement pattern"], min:10 };
const COOLDOWN = { lines:["5 min easy jog or walk","Hip flexor + hamstring + calf stretch, 1 min each side"], min:8 };

// =============== GENERATOR with no-repeat guarantee ===============
function makeSession(targetMin, typeId){
  const budget = targetMin - WARMUP.min - COOLDOWN.min;
  const eligible = TEMPLATES.filter(t=>t.minBudget<=budget);
  const wanted = typeId && typeId!=="any" ? eligible.filter(t=>t.id===typeId) : eligible;
  const t = pick(wanted.length ? wanted : eligible);
  const s = t.make(budget);
  const used = s.blocks.reduce((a,b)=>a+b.minutes,0);
  let topup = null;
  const remaining = budget-used;
  if (remaining >= 10){
    const opts = TOPUPS.filter(x=>x.min<=remaining+4);
    if (opts.length) topup = pick(opts);
  }
  const total = WARMUP.min + used + (topup?topup.min:0) + COOLDOWN.min;
  const sig = JSON.stringify([...s.sig, topup?topup.sig:""]);
  return { type:t.label, typeId:t.id, blocks:s.blocks, stations:s.stations, topup, total, sig };
}
// Retries until the signature has never been completed before (guarantees 6 months of no repeats)
function generateUnique(targetMin, completedSigs, typeId){
  for (let i=0;i<60;i++){
    const s = makeSession(targetMin, typeId);
    if (!completedSigs.has(s.sig)) return s;
  }
  return makeSession(targetMin, typeId); // astronomically unlikely fallback
}

// Explosive movement pools (equipment-aware; bodyweight always qualifies)
const EXPLOSIVE = {
  lower: [ {n:"Box jumps",eq:"bw"},{n:"Broad jumps",eq:"bw"},{n:"Hurdle hops",eq:"bw"},{n:"Jump squats",eq:"bw"},
           {n:"DB jump squats (light)",eq:"db"},{n:"Single-arm DB snatch (fast)",eq:"db"},{n:"Explosive KB swings",eq:"db"} ],
  upper: [ {n:"Med-ball chest throws",eq:"bw"},{n:"Med-ball slams",eq:"bw"},{n:"Plyo push-ups",eq:"bw"},
           {n:"Light DB push press (fast)",eq:"db"} ],
};
// Adds explosive work to a built strength session (contrast pairs / primer / finisher by method)
function addExplosive(sBlocks, methodId, equip, budget, usedMin){
  if (methodId==="power" || methodId==="french") return 0; // already explosive by design
  if (methodId==="max"){
    if (usedMin + 4 > budget + 6) return 0;
    const lower = pickEq(EXPLOSIVE.lower, equip), upper = pickEq(EXPLOSIVE.upper, equip);
    sBlocks.blocks.splice(1, 0, { title:"Explosive Contrast Pairings",
      lines:[`Within 15s of each lower-body heavy set: ${lower} \u00d7 3`,
             `Within 15s of each upper-body heavy set: ${upper} \u00d7 3`],
      minutes: 4,
      intent:"Post-activation potentiation: the heavy set wakes the nervous system, the explosive reps cash it in. Three perfect reps \u2014 fast, fresh, never grinding." });
    sBlocks.sig.push("expl", lower, upper);
    return 4;
  }
  if (methodId==="hyper"){
    if (usedMin + 5 > budget + 6) return 0;
    const a = pickEq(EXPLOSIVE.lower, equip), b = pickEq(EXPLOSIVE.upper, equip);
    sBlocks.blocks.unshift({ title:"Explosive Primer",
      lines:[`3 rounds, fully fresh: ${a} \u00d7 3 + ${b} \u00d7 3`,"Full recovery \u2014 this primes, it doesn't fatigue"],
      minutes: 5,
      intent:"Fast movement first switches on high-threshold motor units, so every hypertrophy set that follows recruits more muscle." });
    sBlocks.sig.push("expl", a, b);
    return 5;
  }
  // endurance: explosive finisher
  if (usedMin + 6 > budget + 6) return 0;
  const a = pickEq(EXPLOSIVE.lower, equip), b = pickEq(EXPLOSIVE.upper, equip);
  sBlocks.blocks.push({ title:"Explosive Finisher",
    lines:[`3 rounds: ${a} \u00d7 5 + ${b} \u00d7 5`,"60-90s rest \u2014 every rep at maximum intent"],
    minutes: 6,
    intent:"Finishing with speed when tired teaches your body to stay explosive deep into a race \u2014 but quality rules: stop the moment reps slow down." });
  sBlocks.sig.push("expl", a, b);
  return 6;
}

function makeStrengthSession(targetMin, methodId, equip, explosive){
  const budget = targetMin - WARMUP_STR.min - COOLDOWN.min;
  const method = METHODS.find(m=>m.id===methodId) || pick(METHODS);
  const sBlocks = method.make(budget, equip||"both");
  let used = sBlocks.blocks.reduce((a,b)=>a+b.minutes,0);
  if (explosive) used += addExplosive(sBlocks, method.id, equip||"both", budget, used);
  let topup = null;
  const remaining = budget - used;
  if (remaining >= 8){
    const opts = STR_TOPUPS.filter(x=>x.min<=remaining+4);
    if (opts.length) topup = pick(opts);
  }
  const total = WARMUP_STR.min + used + (topup?topup.min:0) + COOLDOWN.min;
  const sig = JSON.stringify([...sBlocks.sig, topup?topup.sig:""]);
  return { type: method.label, typeId: method.id, blocks: sBlocks.blocks, stations: [], topup, total, sig, strength: true };
}
function generateUniqueStrength(targetMin, methodId, completedSigs, equip, explosive){
  for (let i=0;i<60;i++){
    const s = makeStrengthSession(targetMin, methodId, equip, explosive);
    if (!completedSigs.has(s.sig)) return s;
  }
  return makeStrengthSession(targetMin, methodId, equip, explosive);
}

// =============== STRENGTH PLAN ENGINE ===============
// 19-week macrocycle, 4 strength sessions/week, cardio owned by the coach.
// Block 1 Max Strength (wk 1-8) \u2192 Block 2 Power Conversion (wk 9-14) \u2192 Block 3 Strength Endurance (wk 15-19).
// Every 4th week is a deload (-25% duration, sets shy of failure).
const PLAN_BLOCKS = [
  { name:"Max Strength", weeks:8,
    slots:[
      { kind:"str", method:"max", explosive:false, label:"Heavy lower + upper" },
      { kind:"focus", groups:["glutes","hams"], label:"Posterior chain" },
      { kind:"str", method:"max", explosive:false, label:"Heavy lifts \u2014 second exposure" },
      { kind:"focus", groups:["core","calves"], label:"Core + lower leg armour" },
    ],
    why:"The economy multiplier: heavy, fast, never to failure. Cheaper strides and pedal strokes." },
  { name:"Power Conversion", weeks:6,
    slots:[
      { kind:"str", method:"french", explosive:false, label:"French contrast" },
      { kind:"str", method:"power", explosive:false, label:"Speed + plyo" },
      { kind:"str", method:"max", explosive:true, label:"Strength maintenance + contrast" },
      { kind:"focus", groups:["glutes","hams"], label:"Posterior chain" },
    ],
    why:"Where speed appears: turn Block 1's force into rate of force. Every rep violent, every landing quiet." },
  { name:"Strength Endurance", weeks:5,
    slots:[
      { kind:"str", method:"endur", explosive:false, label:"Endurance circuit" },
      { kind:"focus", groups:["quads","glutes"], label:"Leg capacity" },
      { kind:"str", method:"endur", explosive:true, label:"Circuit + explosive finisher" },
      { kind:"str", method:"max", explosive:false, label:"Heavy maintenance" },
    ],
    why:"Race conversion: force that refuses to fade \u2014 sled, lunges, and running on loaded legs." },
];
const PLAN_WEEKS = PLAN_BLOCKS.reduce((a,b)=>a+b.weeks,0); // 19
function planPosition(idx){
  const week = Math.floor(idx/4) % PLAN_WEEKS;       // 0-based macro week
  const day = idx % 4;                                // 0-3 within the week
  let w = week, bi = 0;
  while (w >= PLAN_BLOCKS[bi].weeks){ w -= PLAN_BLOCKS[bi].weeks; bi++; }
  const macroWeek1 = week+1;
  return { block:PLAN_BLOCKS[bi], blockIndex:bi, blockWeek:w+1, macroWeek:macroWeek1, day,
    deload: macroWeek1 % 4 === 0, cycle: Math.floor(idx/(4*PLAN_WEEKS))+1 };
}
function dealPlanSession(){
  const pos = planPosition(state.plan.idx);
  const slot = pos.block.slots[pos.day];
  const dur = Math.max(35, Math.round(state.duration * (pos.deload ? 0.75 : 1)));
  let w;
  if (slot.kind==="focus") w = generateUniqueFocus(dur, slot.groups, state.strEquip, state.doneSigs);
  else w = generateUniqueStrength(dur, slot.method, state.doneSigs, state.strEquip, slot.explosive);
  if (pos.deload){
    w.blocks.unshift({ title:"Deload week", lines:["Same movements, \u201375% duration, every set 3+ reps shy of failure","This week absorbs the last three \u2014 don't sabotage it"], minutes:0, intent:"" });
  }
  w.planMeta = { block:pos.block.name, blockWeek:pos.blockWeek, macroWeek:pos.macroWeek, day:pos.day+1, deload:pos.deload, slotLabel:slot.label, cycle:pos.cycle };
  return w;
}

// =============== INDEX CATALOGUE ===============
// Built from the live data structures, so it can never drift out of date
function buildCatalogue(){
  const out = [];
  STATIONS.forEach(st=> out.push({ cat:"Race stations", name:st.name, desc:`Race spec: ${st.race}. No kit? ${st.sub}`, kind:"station", id:st.id }));
  TEMPLATES.forEach(t=> out.push({ cat:"Train sessions", name:t.label, desc:`Race-work session type \u2014 needs ~${t.minBudget+18}+ min.`, kind:"traintype", id:t.id }));
  METHODS.forEach(m=> out.push({ cat:"Strength methods", name:m.label, desc:"Gym methodology on the Strength tab \u2014 barbell, DB/KB, or both.", kind:"method", id:m.id }));
  VO2_PROTOCOLS.forEach(pr=> out.push({ cat:"VO\u2082 protocols", name:pr.name, desc:"VO\u2082max protocol \u2014 run, bike, row, SkiErg, or mixed.", kind:"vo2", id:pr.id }));
  Object.entries(MUSCLES).forEach(([k,m])=> out.push({ cat:"Muscle focus", name:m.label, desc:m.why+".", kind:"muscle", id:k }));
  METCON_FORMATS.forEach(f=> out.push({ cat:"Metcon formats", name:f.id==="amrap"?"AMRAP":f.id==="rft"?"Rounds For Time":f.id==="emom"?"EMOM":f.id==="deathby"?"Death By":f.id==="chipper"?"Chipper":f.id==="tabata"?"Tabata Mash-Up":f.id==="ladder"?"Rep Ladders":"Complexes", desc:"Scoreable metcon format on the Metcon tab.", kind:"mcformat", id:f.id }));
  TREAD_FORMATS.forEach(f=> out.push({ cat:"Tread formats", name:f.id==="rounds"?"Tread + DB Rounds":f.id==="pyramid"?"Treadmill Pyramid":f.id==="incline"?"Incline Ladder":f.id==="speedplay"?"Speed Play":f.id==="compromised"?"Compromised Runs":f.id==="deck"?"The Conveyor":"Sprints + DB EMOM", desc:"Treadmill + dumbbell class format on the Tread tab.", kind:"treadformat", id:f.id }));
  BENCHMARKS.forEach(b=> out.push({ cat:"Benchmarks", name:b.name, desc:(b.score==="time"?"For time. ":"AMRAP. ")+b.lines.slice(0,3).join(", ")+"\u2026", kind:"bench", id:b.id }));
  METCON_MOVES.forEach(m=> out.push({ cat:"Movements", name:m.n, desc:"Metcon movement ("+(m.eq==="bw"?"bodyweight":m.eq==="db"?"DB/KB":"barbell")+").", kind:"move", id:m.n }));
  return out;
}
function goIndex(kind, id){
  if (kind==="traintype"){ state.sessionType=id; state.tab="train"; }
  else if (kind==="station"){ state.tab="train"; }
  else if (kind==="method"){ state.method=id; state.tab="strength"; }
  else if (kind==="vo2"){ state.tab="vo2"; }
  else if (kind==="muscle"){ state.focusGroups=[id]; state.tab="focus"; }
  else if (kind==="mcformat"||kind==="move"){ state.mcView="generate"; state.tab="metcon"; }
  else if (kind==="treadformat"){ state.tab="tread"; }
  else if (kind==="bench"){ state.mcView="bench"; state.tab="metcon"; }
  render();
  window.scrollTo({top:0});
}
function renderIndexResults(){
  const q = (state.indexQ||"").toLowerCase().trim();
  const entries = buildCatalogue().filter(e => !q || e.name.toLowerCase().includes(q) || e.desc.toLowerCase().includes(q) || e.cat.toLowerCase().includes(q));
  if (!entries.length) return `<p style="font-size:14px;color:var(--sub);text-align:center;padding:1.5rem 0">Nothing matches \u201c${esc(state.indexQ)}\u201d.</p>`;
  const byCat = {};
  entries.forEach(e=>{ (byCat[e.cat] = byCat[e.cat]||[]).push(e); });
  return Object.entries(byCat).map(([c,list])=>`
    <h3 class="eyebrow" style="margin:14px 0 6px">${esc(c)} (${list.length})</h3>
    ${list.map(e=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--grid)">
      <div><p style="font-size:14px;font-weight:700">${esc(e.name)}</p><p style="font-size:12px;color:var(--sub)">${esc(e.desc)}</p></div>
      ${e.kind!=="move"&&e.kind!=="station"?`<button class="pill" style="flex-shrink:0;font-size:12px;font-weight:800" onclick="goIndex('${e.kind}','${esc(e.id).replace(/'/g,"\\'")}')">Open</button>`:""}
    </div>`).join("")}`).join("");
}

function loadState(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw){ const d = JSON.parse(raw); state.done = d.done||[]; state.raceDate = d.raceDate||""; state.bench = d.bench||{}; if (d.plan) state.plan = d.plan; }
  } catch(e){}
  state.doneSigs = new Set(state.done.map(x=>x.sig));
}
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify({ done: state.done, raceDate: state.raceDate, bench: state.bench, plan: state.plan })); }
  catch(e){ console.error("Save failed", e); }
}

// Best logged time for a station/run id, or null
function bestTime(id){
  const vals = state.done.filter(d=>d.results && d.results[id]!=null).map(d=>d.results[id]);
  return vals.length ? Math.min(...vals) : null;
}
// Predicted race time from logged bests + typical fallbacks
function predictRace(){
  let total = ROXZONE_SEC, logged = 0;
  const parts = [];
  STATIONS.forEach(st=>{
    const b = bestTime(st.id);
    const sec = b!=null ? b : TYPICAL[st.id];
    if (b!=null) logged++;
    parts.push({ name:st.name, sec, est:b==null });
    total += sec;
  });
  const runB = bestTime("runkm");
  const runSec = (runB!=null ? runB : TYPICAL.runkm);
  if (runB!=null) logged++;
  parts.unshift({ name:"8 × 1km runs", sec:runSec*8, est:runB==null });
  total += runSec*8;
  return { total, parts, logged };
}
// Smart suggestion: the eligible session type you've trained least in the last 14 days
function suggestSession(){
  const cutoff = Date.now() - 14*864e5;
  const counts = {};
  TEMPLATES.forEach(t=>counts[t.label]=0);
  state.done.forEach(d=>{ if (new Date(d.date+"T00:00:00").getTime()>=cutoff && counts[d.type]!=null) counts[d.type]++; });
  const budget = state.duration - WARMUP.min - COOLDOWN.min;
  const eligible = TEMPLATES.filter(t=>t.minBudget<=budget);
  const minCount = Math.min(...eligible.map(t=>counts[t.label]));
  const candidates = eligible.filter(t=>counts[t.label]===minCount);
  const chosen = pick(candidates);
  state.sessionType = chosen.id;
  state.suggestReason = minCount===0
    ? `Nothing from "${chosen.label}" in your last 14 days`
    : `"${chosen.label}" is your least-trained type recently (${minCount} in 14 days)`;
  roll();
}

      <p style="font-size:11px;color:var(--sub);margin-top:4px">${pred.logged}/9 splits from your logged bests${pred.logged<9?", the rest from typical open-division times — log more results to sharpen this":""}. Includes ~${Math.round(ROXZONE_SEC/60)} min roxzone.</p>
      <details class="subs" style="margin-top:8px"><summary>Split breakdown</summary>
        ${pred.parts.map(p=>`<p style="display:flex;justify-content:space-between"><span>${esc(p.name)}${p.est?" <em style='color:var(--faint)'>(est.)</em>":""}</span><strong>${fmtTime(p.sec)}</strong></p>`).join("")}
      </details>
    </section>`;

    const week = state.done.filter(d=>{
      const dd = new Date(d.date+"T00:00:00");
      return (Date.now()-dd.getTime()) < 7*864e5;
    }).length;
    const byType = {};
    state.done.forEach(d=>{ byType[d.type]=(byType[d.type]||0)+1; });
    html += `<div class="statgrid">
      <div class="stat"><div class="display">${n}</div><div class="lbl">Banked</div></div>
      <div class="stat"><div class="display">${week}</div><div class="lbl">This week</div></div>
      <div class="stat"><div class="display">${Math.max(0,TARGET_SESSIONS-n)}</div><div class="lbl">To 6 months</div></div>
    </div>`;
    // Station time trends from logged results
    const RESULT_META = STATIONS.map(st=>({id:st.id,name:st.name})).concat([{id:"runkm",name:"1km Run Split"},{id:"redzone",name:"VO\u2082 Red-Zone Time"}]);
    const tracked = RESULT_META.filter(m => state.done.some(d=>d.results && d.results[m.id]!=null));
    if (tracked.length){
      if (!tracked.some(m=>m.id===state.chartStation)) state.chartStation = tracked[0].id;
      const data = state.done.filter(d=>d.results && d.results[state.chartStation]!=null)
        .map(d=>({ date:fmtDate(d.date), sec:d.results[state.chartStation] }));
      const best = Math.min(...data.map(d=>d.sec));
      html += `<section class="card">
        <h3 class="eyebrow" style="margin-bottom:8px">Station trends</h3>
        <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px">
          ${tracked.map(m=>`<button class="pill ${m.id===state.chartStation?"active":""}" style="white-space:nowrap;flex-shrink:0" onclick="setChartStation('${m.id}')">${esc(m.name)}</button>`).join("")}
        </div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
          <span class="display" style="font-size:15px">${esc(RESULT_META.find(m=>m.id===state.chartStation).name)}</span>
          <span style="font-size:12px;font-weight:700;color:var(--sub)">Best: ${fmtTime(best)}</span>
        </div>
        ${data.length>1 ? timeChart(data, state.chartStation==="redzone")
          : `<p style="font-size:13px;color:var(--sub);text-align:center;padding:1.5rem 0">One time logged (${fmtTime(data[0].sec)}). Log it again in a future session and the trend appears.</p>`}
      </section>`;
    }
    if (Object.keys(byType).length){
      html += `<section class="card"><h3 class="eyebrow" style="margin-bottom:8px">Session mix</h3>
        ${Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([t,c])=>`
          <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px">
            <span>${esc(t)}</span><span>${c}</span>
          </div>
          <div class="meter-bar" style="margin:0 0 10px"><div class="meter-fill" style="width:${Math.round(c/n*100)}%"></div></div>`).join("")}
      </section>`;
    }
    html += state.done.slice().reverse().map((d,i)=>`<details>
      <summary><span><span class="typechip">${esc(d.type.split(" ")[0])}</span>${fmtDate(d.date)} · ${d.total} min${d.rpe?` · ${esc(d.rpe)}`:""}</span></summary>
      <div style="margin-top:8px;font-size:13px;color:#3A414B">
        ${d.titles.map(t=>`<p>▸ ${esc(t)}</p>`).join("")}
        ${d.results && Object.keys(d.results).length ? `<p style="margin-top:6px;font-weight:600;color:var(--ink)">Times: ${Object.entries(d.results).map(([id,sec])=>{
          const nm = id==="runkm" ? "1km avg" : (BY_ID[id]?BY_ID[id].name:id);
          return esc(nm)+" "+fmtTime(sec);
        }).join(" · ")}</p>` : ""}
        <button class="del" style="margin-top:8px" onclick="removeDone(${state.done.length-1-i})">Delete (returns it to the pool)</button>
      </div>
    </details>`).join("");
    if (!n) html += `<section class="card" style="text-align:center;padding:2rem 1rem">
      <p class="display" style="font-size:18px;margin-bottom:8px">No sessions banked yet</p>
      <p style="font-size:14px;color:var(--sub)">Generate a session in the Train tab and mark it completed. Six months of unrepeated Hyrox training starts with one.</p></section>`;

    html += `<section class="card" style="margin-top:1rem">
      <h3 class="eyebrow" style="margin-bottom:8px">Backup &amp; transfer</h3>
      <div style="display:flex;gap:8px">
        <button class="outlinebtn" style="flex:1" onclick="exportData()">Export</button>
        <button class="outlinebtn" style="flex:1" onclick="document.getElementById('importFile').click()">Import</button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importData(this)">
      <p class="hint" id="backupHint" style="min-height:1em;margin-top:8px"></p>
    </section>`;
  }

  html += `<p class="footer">Fully offline. Completed sessions are remembered on this device so nothing ever repeats.</p>`;
  app.innerHTML = html;
}

// =============== ACTIONS ===============
function setTab(t){ state.tab=t; render(); }
function setMethod(m){ state.method=m; render(); }
function setDurationS(v){ state.duration=+v; const el=document.getElementById("durLabelS"); if(el) el.textContent=v+" min"; }
function rollStr(){ state.strWorkout = generateUniqueStrength(state.duration, state.method, state.doneSigs, state.strEquip, state.strExplosive); state.completedStr=false; render(); }
function setStrEquip(e){ state.strEquip=e; render(); }
function toggleExplosive(){ state.strExplosive=!state.strExplosive; render(); }
function startPlan(){ state.plan.active=true; if(!state.plan.startDate) state.plan.startDate=todayStr(); persist(); render(); }
function stopPlan(){ state.plan.active=false; state.planWorkout=null; persist(); render(); }
function rollPlan(){ state.planWorkout = dealPlanSession(); state.completedPlan=false; render(); }
function completePlan(){
  if (!state.planWorkout || state.completedPlan) return;
  const w = state.planWorkout;
  state.done.push({ date:todayStr(), sig:w.sig, type:w.type, total:w.total, rpe:null, results:{},
    titles:["Plan "+w.planMeta.block+" wk"+w.planMeta.blockWeek+" d"+w.planMeta.day+": "+w.planMeta.slotLabel].concat(w.blocks.filter(b=>b.minutes>0).map(b=>b.title)) });
  state.doneSigs.add(w.sig);
  state.plan.idx++;
  state.completedPlan = true;
  state.planWorkout = null;
  persist(); render();
}
function completeStr(){
  if (!state.strWorkout || state.completedStr) return;
  const w = state.strWorkout;
  state.done.push({ date:todayStr(), sig:w.sig, type:w.type, total:w.total, rpe:state.rpeStr, results:{},
    titles: w.blocks.map(b=>b.title).concat(w.topup?["Top-up: "+w.topup.lines[0]]:[]) });
  state.doneSigs.add(w.sig);
  state.completedStr = true;
  state.rpeStr = null;
  persist(); render();
}
function setDuration(v){ state.duration=+v; document.getElementById("durLabel").textContent=v+" min"; }
function roll(){ state.workout = generateUnique(state.duration, state.doneSigs, state.sessionType); state.completedThis=false; state.results={}; state.rpe=null; render(); }
function setResult(id, el){ state.results[id] = el.value; }
function setRpe(r){ state.rpe = state.rpe===r ? null : r; render(); }
function setRpeStr(r){ state.rpeStr = state.rpeStr===r ? null : r; render(); }
function setChartStation(id){ state.chartStation=id; render(); }
function setRaceDate(v){ state.raceDate = v||""; persist(); render(); }
function setVo2Mode(m){ state.vo2Mode=m; render(); }
function toggleFocusGroup(g){
  const i = state.focusGroups.indexOf(g);
  if (i>=0){ if (state.focusGroups.length>1) state.focusGroups.splice(i,1); }
  else if (state.focusGroups.length<3) state.focusGroups.push(g);
  render();
}
function setDurationF(v){ state.duration=+v; const el=document.getElementById("durLabelF"); if(el) el.textContent=v+" min"; }
function rollFocus(){ state.focusWorkout = generateUniqueFocus(state.duration, state.focusGroups, state.strEquip, state.doneSigs); state.completedFocus=false; state.rpeF=null; render(); }
function setRpeF(r){ state.rpeF = state.rpeF===r ? null : r; render(); }
function setDurationM(v){ state.duration=+v; const el=document.getElementById("durLabelM"); if(el) el.textContent=v+" min"; }
function setMcEquip(e){ state.mcEquip=e; render(); }
function setMcView(v){ state.mcView=v; render(); }
function setIndexQ(el){
  state.indexQ = el.value;
  const box = document.getElementById("idxResults");
  if (box) box.innerHTML = renderIndexResults();
}
function setBenchInput(id, el){ state.benchInput[id] = el.value; }
function logBench(id){
  const bm = BENCHMARKS.find(b=>b.id===id);
  if (!bm) return;
  const raw = state.benchInput[id];
  const val = bm.score==="time" ? parseTime(raw) : (/^\d+$/.test(String(raw||"").trim()) ? parseInt(raw,10) : null);
  if (!val || val<=0) return;
  if (!state.bench[id]) state.bench[id]=[];
  state.bench[id].push({ date:todayStr(), val });
  state.benchInput[id] = "";
  // benchmarks also appear in the session log (unique sig per attempt — repeating is the point)
  state.done.push({ date:todayStr(), sig:"bench-"+id+"-"+Date.now(), type:"Benchmark", total:null, rpe:null, results:{},
    titles:[bm.name+" \u2014 "+(bm.score==="time"?fmtTime(val):val+" rounds")] });
  state.doneSigs.add(state.done[state.done.length-1].sig);
  persist(); render();
}
function deleteBench(id, idx){
  if (!state.bench[id]) return;
  state.bench[id].splice(idx,1);
  persist(); render();
}
function setDurationT(v){ state.duration=+v; const el=document.getElementById("durLabelT"); if(el) el.textContent=v+" min"; }
function rollTR(){ state.trWorkout = generateUniqueTread(Math.min(90,Math.max(30,state.duration)), state.doneSigs); state.completedTR=false; state.rpeTR=null; state.trRun=""; render(); }
function setTrRun(el){ state.trRun = el.value; }
function setRpeTR(r){ state.rpeTR = state.rpeTR===r ? null : r; render(); }
function completeTR(){
  if (!state.trWorkout || state.completedTR) return;
  const w = state.trWorkout;
  const results = {};
  const rk = parseTime(state.trRun);
  if (rk) results.runkm = rk;
  state.done.push({ date:todayStr(), sig:w.sig, type:w.type, total:w.total, rpe:state.rpeTR, results,
    titles: w.blocks.map(b=>b.title) });
  state.doneSigs.add(w.sig);
  state.completedTR = true;
  persist(); render();
}
function rollMC(){ state.mcWorkout = generateUniqueMetcon(Math.min(90,Math.max(25,state.duration)), state.mcEquip, state.doneSigs); state.completedMC=false; state.rpeMC=null; render(); }
function setRpeMC(r){ state.rpeMC = state.rpeMC===r ? null : r; render(); }
function completeMC(){
  if (!state.mcWorkout || state.completedMC) return;
  const w = state.mcWorkout;
  state.done.push({ date:todayStr(), sig:w.sig, type:w.type, total:w.total, rpe:state.rpeMC, results:{},
    titles: w.blocks.map(b=>b.title) });
  state.doneSigs.add(w.sig);
  state.completedMC = true;
  persist(); render();
}
function completeFocus(){
  if (!state.focusWorkout || state.completedFocus) return;
  const w = state.focusWorkout;
  state.done.push({ date:todayStr(), sig:w.sig, type:w.type, total:w.total, rpe:state.rpeF, results:{},
    titles: w.blocks.map(b=>b.title) });
  state.doneSigs.add(w.sig);
  state.completedFocus = true;
  persist(); render();
}
function setDurationV(v){ state.duration=+v; const el=document.getElementById("durLabelV"); if(el) el.textContent=v+" min"; }
function rollVO2(){ state.vo2Workout = generateUniqueVO2(Math.min(90,Math.max(40,state.duration)), state.vo2Mode, state.doneSigs); state.completedVO2=false; state.vo2Red=""; state.rpeV=null; render(); }
function setVo2Red(el){ state.vo2Red = el.value; }
function setRpeV(r){ state.rpeV = state.rpeV===r ? null : r; render(); }
function completeVO2(){
  if (!state.vo2Workout || state.completedVO2) return;
  const w = state.vo2Workout;
  const results = {};
  const rz = parseTime(state.vo2Red);
  if (rz) results.redzone = rz;
  state.done.push({ date:todayStr(), sig:w.sig, type:w.type, total:w.total, rpe:state.rpeV, results,
    titles: w.blocks.map(b=>b.title) });
  state.doneSigs.add(w.sig);
  state.completedVO2 = true;
  persist(); render();
}
function setSessionType(t){ state.sessionType=t; render(); }
function complete(){
  if (!state.workout || state.completedThis) return;
  const w = state.workout;
  const results = {};
  Object.entries(state.results).forEach(([id,v])=>{ const sec = parseTime(v); if (sec) results[id]=sec; });
  state.done.push({ date:todayStr(), sig:w.sig, type:w.type, total:w.total, rpe:state.rpe, results,
    titles: w.blocks.map(b=>b.title).concat(w.topup?["Top-up: "+w.topup.lines[0]]:[]) });
  state.doneSigs.add(w.sig);
  state.completedThis = true;
  persist(); render();
}
function removeDone(idx){
  const d = state.done[idx];
  if (!d) return;
  state.done.splice(idx,1);
  state.doneSigs = new Set(state.done.map(x=>x.sig));
  persist(); render();
}
function backupMsg(text, ok){
  const h = document.getElementById("backupHint");
  if (h){ h.textContent=text; h.className = "hint"+(ok?" ok":""); }
}
function exportData(){
  try {
    const blob = new Blob([JSON.stringify({ app:"hyrox-forge", version:1, exportedAt:new Date().toISOString(), done:state.done }, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=url; a.download="hyrox-forge-backup-"+todayStr()+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    backupMsg("Exported "+state.done.length+" completed session(s).", true);
  } catch(e){ backupMsg("Export failed — try a different browser.", false); }
}
function importData(input){
  const file = input.files && input.files[0];
  input.value="";
  if (!file) return;
  const reader = new FileReader();
  reader.onerror = ()=>backupMsg("Couldn't read that file.", false);
  reader.onload = ()=>{
    try {
      const d = JSON.parse(reader.result);
      if (d.app!=="hyrox-forge" || !Array.isArray(d.done)){ backupMsg("That doesn't look like a Hyrox Forge backup.", false); return; }
      const have = new Set(state.done.map(x=>x.sig+x.date));
      const fresh = d.done.filter(x=>x && x.sig && !have.has(x.sig+x.date));
      state.done = state.done.concat(fresh).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
      state.doneSigs = new Set(state.done.map(x=>x.sig));
      persist(); render();
      backupMsg("Imported "+fresh.length+" new session(s)."+(fresh.length===0?" Everything was already here.":""), true);
    } catch(e){ backupMsg("Import failed — the file couldn't be parsed.", false); }
  };
  reader.readAsText(file);
}

loadState();
render();
